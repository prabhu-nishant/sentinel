spring:
  application:
    name: sentinel

  # 1. AI Configuration
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: phi3
          temperature: 0.0
      embedding:
        options:
          model: phi3
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-validation: false
        dimensions: 3072
        index-type: hnsw

  # 2. Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/sanctions_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  # 3. JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect